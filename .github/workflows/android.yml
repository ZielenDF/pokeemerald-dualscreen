name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply SDL2 lifecycle patch
        working-directory: android/SDL2
        run: |
          if git apply --check ../patches/sdl2-android-lifecycle.patch 2>/dev/null; then
            git apply ../patches/sdl2-android-lifecycle.patch
          else
            echo "Patch already applied or not applicable, skipping"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev cmake

      - name: Build tools and generate assets
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j$(nproc)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          validate-wrappers: false

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-dualscreen-apk
          path: android/app/build/outputs/apk/debug/*.apk
